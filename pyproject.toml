[project]
name = "telegram-ai-autoreply"
version = "2.0.0"
description = "AI auto-reply for a Telegram account, with switchable personalities and account-safety rails"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = [
    "E501",    # long lines are caught by the formatter
    "B008",    # dataclass field(default_factory=...) is the intended pattern
    "SIM105",  # contextlib.suppress is not always clearer than try/except
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
