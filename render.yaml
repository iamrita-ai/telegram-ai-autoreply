services:
  - type: web
    name: telegram-ai-autoreply
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Secrets are set in the Render dashboard, never committed.
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # Non-secret defaults, safe to keep in the repo.
      - key: DEFAULT_PERSONA
        value: casual
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: INFO
