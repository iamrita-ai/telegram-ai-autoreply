services:
  - type: web
    name: telegram-ai-autoreply
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Secrets are set in the Render dashboard, never committed.
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      # Non-secret defaults, safe to keep in the repo.
      - key: DEFAULT_PERSONA
        value: casual
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: INFO
      # Render suspends a free web service after ~15 minutes with no inbound
      # HTTP request, which would take the userbot offline mid-conversation.
      # The service pings its own RENDER_EXTERNAL_URL to stay resident.
      - key: KEEPALIVE
        value: "true"
      - key: KEEPALIVE_INTERVAL
        value: "600"
      # Behaviour that makes the account read like a person: the read receipt
      # goes out after the reply, and the full-screen reaction is saved for
      # news that deserves it.
      - key: MARK_AS_READ
        value: "true"
      - key: BIG_REACTIONS
        value: "true"
      # Bot API 10.1 panels for the control bot. Falls back to plain markdown
      # on any server that does not implement sendRichMessage.
      - key: RICH_MESSAGES
        value: "true"
